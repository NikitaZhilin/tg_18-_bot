[project]
name = "tg-18-bot"
version = "0.1.0"
description = "Private Telegram card game bot"
requires-python = ">=3.10"
dependencies = [
  "aiogram>=3.7,<4.0",
  "aiohttp-socks>=0.8,<1.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
